name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # No Ollama in CI: tests that need it skip themselves; the rest use fakes.
      - name: Run tests
        run: uv run pytest -q
