[project]
name = "research-analyst"
version = "0.1.0"
description = "Agentic research & report analyst built with RAG, LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.0",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "flashrank>=0.2",
    "joblib>=1.4",
    "langchain>=1.0",
    "langchain-ollama>=1.0",
    "langchain-qdrant>=0.2",
    "langchain-text-splitters>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Free cloud tiers for faster responses during demos
groq = ["langchain-groq>=1.0"]
gemini = ["langchain-google-genai>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
